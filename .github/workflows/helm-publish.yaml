name: Helm

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
    paths:
      - "deployment/anima/**"
      - ".github/workflows/helm-publish.yaml"
  pull_request:
    branches: ["main"]
    paths:
      - "deployment/anima/**"
      - ".github/workflows/helm-publish.yaml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  CHART_PATH: deployment/anima
  # Publishes as ghcr.io/<owner>/<repo>/anima:<chart-version>.
  CHART_REPOSITORY: ${{ github.repository }}

jobs:
  chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint Helm chart
        run: helm lint "${CHART_PATH}"

      - name: Render Helm chart
        run: helm template anima "${CHART_PATH}"

      - name: Package Helm chart
        run: |
          mkdir -p dist

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            helm package "${CHART_PATH}" \
              --destination dist \
              --version "${version}" \
              --app-version "${version}"
          else
            helm package "${CHART_PATH}" --destination dist
          fi

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${REGISTRY}" \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Publish Helm chart
        if: startsWith(github.ref, 'refs/tags/v')
        run: helm push dist/*.tgz "oci://${REGISTRY}/${CHART_REPOSITORY}"
