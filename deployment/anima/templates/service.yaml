{{- range $name, $component := .Values.components }}
{{- if and $component.enabled (dig "service" "enabled" false $component) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "anima.componentName" (dict "root" $ "component" $name) }}
  labels:
    {{- include "anima.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
  {{- with $component.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $component.service.type | default "ClusterIP" }}
  ports:
    - name: http
      port: {{ $component.service.port }}
      targetPort: http
      protocol: TCP
      {{- with $component.service.nodePort }}
      nodePort: {{ . }}
      {{- end }}
  selector:
    {{- include "anima.selectorLabels" (dict "root" $ "component" $name) | nindent 4 }}
{{- end }}
{{- end }}
